<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedario Italienisch</title>
<meta name="description" content="Karteikarten für Italienisch aus deinen Unterlagen, mit Phasen-Wiederholsystem.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schedario">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* Eine Spalte fürs Telefon. Italienische Wörter in Bodoni, Bedienung in der Systemschrift.
     Grün und Rot stehen nur für richtig und falsch, Azzurro ist die Akzentfarbe. */
  --paper: #f2f4f1;
  --card: #ffffff;
  --ink: #16202b;
  --muted: #586472;
  --line: #d5dade;
  --accent: #1c5aa6;
  --accent-ink: #ffffff;
  --accent-soft: #e1ebf7;
  --ok: #1a7445;
  --ok-soft: #dcf0e3;
  --bad: #b02e2b;
  --bad-soft: #f8e1df;
  --warn: #855900;
  --warn-soft: #f6ecd0;
  --font-display: "Bodoni 72", "Bodoni Moda", Didot, "Bodoni MT", "Times New Roman", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --card: #19212a; --ink: #e9edf0; --muted: #9aa6b2; --line: #2c3743;
    --accent: #78afef; --accent-ink: #0b1622; --accent-soft: #1a2c43;
    --ok: #5fc490; --ok-soft: #153224; --bad: #f08883; --bad-soft: #3b1e1d; --warn: #e3b95a; --warn-soft: #3a2e12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --card: #19212a; --ink: #e9edf0; --muted: #9aa6b2; --line: #2c3743;
  --accent: #78afef; --accent-ink: #0b1622; --accent-soft: #1a2c43;
  --ok: #5fc490; --ok-soft: #153224; --bad: #f08883; --bad-soft: #3b1e1d; --warn: #e3b95a; --warn-soft: #3a2e12;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 17px/1.45 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#view:focus { outline: none; }

.app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
.app.focus { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 10px; }
.rowflex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.center { text-align: center; }

/* Kopf */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 20px 0 4px; }
.brand { font-family: var(--font-display); font-size: 34px; line-height: 1; font-weight: 700; letter-spacing: -0.01em; }
.brand-sub { color: var(--muted); font-size: 14px; }
.page-title { font-family: var(--font-display); font-size: 30px; line-height: 1.1; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.backlink { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 18px 8px 6px 0; color: var(--accent); font-weight: 600; }
.eyebrow { font: 600 11.5px/1.3 var(--font-mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.section-h { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); padding: 6px 2px 0; }

/* Flächen */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.note { border-radius: 12px; padding: 12px 14px; font-size: 15px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 8px; }
.note.warn { background: var(--warn-soft); }
.note.bad { background: var(--bad-soft); }
.note strong { font-weight: 700; }
.detail { font: 12.5px/1.4 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }

/* Schaltflächen */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-weight: 650; font-size: 16px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 56px; font-size: 18px; width: 100%; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.okb { background: var(--ok); border-color: var(--ok); color: var(--card); }
.btn.badb { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.wide { flex: 1 1 0; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }

.pill { display: inline-flex; align-items: center; white-space: nowrap; font-size: 12.5px; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.okp { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

/* Heute */
.bignum { font-family: var(--font-display); font-size: 64px; line-height: 0.95; font-weight: 700; font-variant-numeric: lining-nums; }
.bignum span { font-family: var(--font-body); font-size: 18px; font-weight: 600; color: var(--muted); margin-left: 8px; }

/* Karteikasten: sieben Fächer */
.phases { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; }
.ph { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.ph .n { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ph .bar { width: 100%; height: 56px; border-radius: 8px 8px 3px 3px; background: var(--paper); border: 1px solid var(--line); display: flex; align-items: flex-end; overflow: hidden; }
.ph .bar i { display: block; width: 100%; background: var(--accent); min-height: 0; border-radius: 2px 2px 0 0; }
.ph.new .bar i { background: var(--muted); }
.ph.done .bar i { background: var(--ok); }
.ph .lab { font-size: 13px; font-weight: 700; }
.ph .cap { font-size: 10.5px; letter-spacing: -0.01em; line-height: 14px; min-height: 14px; color: var(--muted); white-space: nowrap; }

/* Listen */
.list { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 14px 14px 14px 16px; min-height: 60px; }
.list > :first-child, .list > :first-child .row { border-top: 0; }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
.row-main strong { font-weight: 650; overflow-wrap: anywhere; }
.row-side { display: flex; gap: 6px; align-items: center; flex: none; }
.chev { color: var(--muted); flex: none; }

/* Lernkarte */
.sess-top { display: flex; align-items: center; gap: 10px; padding: 10px 0 6px; }
.prog { flex: 1 1 auto; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.25s ease; }
.prog-n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.front { font-size: 26px; line-height: 1.2; font-weight: 650; overflow-wrap: anywhere; text-wrap: balance; }
.front.it { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1.08; letter-spacing: -0.005em; }
.front.mid { font-size: 23px; }
.front.it.mid { font-size: 28px; line-height: 1.18; }
.front.long { font-size: 19px; font-weight: 600; line-height: 1.38; text-wrap: pretty; }
.front.it.long { font-size: 23px; }
.front em, .soltext em { font-family: var(--font-display); font-style: italic; font-size: 1.1em; }
.front.it em { font-size: 1em; }
.gap { display: inline-block; width: 2.6em; border-bottom: 3px solid var(--accent); margin: 0 0.12em; transform: translateY(-0.12em); }
.sub { color: var(--muted); font-size: 15px; margin-top: -6px; }
.sub strong { color: var(--accent); font-weight: 750; }
.rule { width: 44px; height: 3px; background: var(--accent); border-radius: 2px; }

.fields { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.flabel { display: flex; justify-content: space-between; align-items: baseline; gap: 2px 8px; flex-wrap: wrap; }
.flabel label, .flabel .lbl { font-size: 14px; font-weight: 650; }
.flabel label.lit { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.flabel label.mono { font-family: var(--font-mono); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fsub { font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--muted); }
.inp, .ta, .sel { width: 100%; min-height: 50px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); font-size: 18px; }
.ta { min-height: 96px; line-height: 1.4; resize: vertical; font-size: 16px; }
.sel { font-size: 16px; appearance: auto; }
.inp:focus, .ta:focus, .sel:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field.ok .inp { border-color: var(--ok); background: var(--ok-soft); }
.field.bad .inp { border-color: var(--bad); background: var(--bad-soft); }
.fix { font-size: 15px; color: var(--bad); }
.fq { display: flex; align-items: center; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.fq-t { font-family: var(--font-display); font-size: 25px; line-height: 1.15; font-weight: 700; text-wrap: balance; min-width: 0; }
.fq-d { font: 700 19px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; padding: 5px 11px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.field + .field:has(.fq) { padding-top: 6px; border-top: 1px solid var(--line); }
/* Übersetzbare Wörter: nur eingefärbt, ohne Unterstreichung */
span.w { color: var(--accent); cursor: pointer; border-radius: 4px; -webkit-tap-highlight-color: transparent; }
span.w:hover, span.w.on { background: var(--accent-soft); }
.w:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tip { position: absolute; z-index: 25; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(8, 12, 18, 0.22); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; }
.tip-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -4px -6px -2px 0; }
.tip-w { font-family: var(--font-display); font-size: 24px; font-weight: 700; overflow-wrap: anywhere; }
.tip-x { width: 36px; height: 36px; }
.tip-m { display: flex; flex-direction: column; gap: 1px; }
.tip-t { font-weight: 700; font-size: 18px; line-height: 1.35; }
.tip-n { font-family: var(--font-display); font-style: italic; color: var(--muted); font-size: 15px; }
.tip-ex, .tip-s { display: flex; flex-direction: column; gap: 3px; }
.tip-ex:not(:empty), .tip-s:not(:empty) { border-top: 1px solid var(--line); padding-top: 9px; }
.tip-ei { font-family: var(--font-display); font-style: italic; font-size: 17px; line-height: 1.4; color: var(--ink); }
.tip-ei b { font-weight: 700; color: var(--accent); }
.tip-ed { font-size: 14.5px; color: var(--muted); line-height: 1.4; }
.tip .tip-next { margin-top: 3px; font-size: 14px; }
.tip-p { font-size: 14.5px; color: var(--muted); line-height: 1.4; }
.tip-p em { color: var(--ink); }
.tip-p.bad { color: var(--bad); }
.tip-load { font-size: 14.5px; color: var(--muted); }
.tip .link { align-self: flex-start; font-size: 15px; }
.fnote { font-size: 14.5px; font-weight: 600; color: var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 10px; }
.also { font-size: 14.5px; color: var(--muted); }
.also > span { font-family: var(--font-display); font-style: italic; font-size: 16px; color: var(--ink); }
.fhint { font-size: 13.5px; line-height: 1.35; color: var(--muted); margin-top: -3px; }
.inp::placeholder { color: var(--muted); opacity: 0.75; font-style: italic; }
.diff { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; padding: 10px 12px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); font-size: 17px; line-height: 1.45; }
.diff .dl { font: 700 11.5px/1.3 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.diff .dv { overflow-wrap: anywhere; min-width: 0; }
.diff strong.dv { font-weight: 650; }
.diff .dn { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
mark.bad { background: var(--bad-soft); color: var(--bad); text-decoration: underline wavy var(--bad); text-underline-offset: 3px; border-radius: 3px; padding: 0 1px; }
mark.miss { background: var(--ok-soft); color: var(--ok); font-weight: 800; border-radius: 3px; padding: 0 1px; }
mark.sp { padding: 0 3px; }
.fix.warn mark.miss { background: var(--warn-soft); color: var(--warn); }
.fix.warn { color: var(--warn); }
.fix strong { font-weight: 700; }
.conj .field { flex-direction: row; align-items: center; gap: 10px; flex-wrap: wrap; }
.conj .flabel { width: 62px; flex: none; }
.conj .flabel label { font-family: var(--font-display); font-style: italic; font-size: 17px; font-weight: 500; }
.conj .inp { flex: 1 1 120px; width: auto; min-width: 0; min-height: 46px; }
.conj .fix { flex-basis: 100%; padding-left: 72px; }
.conj .diff { flex-basis: 100%; margin-left: 72px; }
@media (max-width: 360px) { .conj .diff { margin-left: 0; } }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg-b { min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); font-family: var(--font-display); font-size: 21px; font-weight: 600; padding: 4px 2px; }
.seg-b.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.seg-b:disabled { cursor: default; opacity: 1; color: var(--muted); }
.seg-b.right:disabled { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.seg-b.wrong:disabled { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }

.accents { display: flex; gap: 6px; }
.acckey { flex: 1 1 0; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 18px; font-family: var(--font-display); }

.verdict { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 12px; font-weight: 700; }
.verdict small { font-weight: 500; font-size: 14px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.learn { background: var(--accent-soft); color: var(--accent); }
.solution { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.soltext { font-size: 18px; line-height: 1.45; overflow-wrap: anywhere; }
.soltext strong { font-weight: 750; }
.info { font-size: 15px; color: var(--muted); padding-left: 12px; border-left: 3px solid var(--line); }
.src { font: 12px/1.3 var(--font-mono); color: var(--muted); }
.actions { display: flex; gap: 10px; }
.actions.col { flex-direction: column; }

/* Zusammenfassung */
.summary { padding-top: 36px; }
.display { font-family: var(--font-display); font-size: 54px; line-height: 1; font-weight: 700; font-style: italic; }

/* Deck */
details.grp { border-top: 1px solid var(--line); }
details.grp:first-child { border-top: 0; }
details.grp > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; cursor: pointer; font-weight: 650; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); flex: none; margin-left: 4px; }
details.grp[open] > summary::after { transform: rotate(-135deg); }
details.grp > summary .grow { overflow-wrap: anywhere; }
.crow { border-top: 1px solid var(--line); }
.crow-b { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: none; border: 0; text-align: left; padding: 11px 16px; min-height: 48px; }
.crow-t { min-width: 0; overflow-wrap: anywhere; font-size: 16px; }
.crow-t.it { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.crow-d { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.crow-d .solution { border-top: 0; padding-top: 0; }
.kv { font-size: 14px; color: var(--muted); }
.pick { display: flex; align-items: flex-start; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); }
.pick input { width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.pick .pt { min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 2px; }
.pick .pt b { font-weight: 600; }
.pick .pt b.it { font-family: var(--font-display); font-size: 19px; }
.pick .pt span { font-size: 14px; color: var(--muted); }

/* Import */
.drop { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 26px 16px; border: 2px dashed var(--line); border-radius: var(--radius); background: var(--card); cursor: pointer; }
.drop strong { font-size: 18px; color: var(--accent); }
.drop:focus-within { border-color: var(--accent); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-size: 15px; font-weight: 600; cursor: pointer; }
.chip input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.pre { font: 12.5px/1.45 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.live { display: flex; flex-direction: column; gap: 4px; min-height: 150px; }
.live li { font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live li:last-child { color: var(--ink); font-weight: 600; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .prog i { transition: none; } }

/* Optionen */
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.opt > span { min-width: 0; }
.stepper { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-size: 22px; font-weight: 600; line-height: 1; }
.stepper output { min-width: 40px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.switch { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }

/* Leiste unten */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar ul { display: flex; max-width: 560px; margin: 0 auto; }
.tabbar li { flex: 1 1 0; }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 8px; font-size: 12px; font-weight: 650; color: var(--muted); text-decoration: none; }
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: min(520px, calc(100vw - 32px)); background: var(--ink); color: var(--paper); padding: 11px 16px; border-radius: 12px; font-size: 15px; font-weight: 600; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.2s; text-align: center; }
.toast.show { opacity: 1; }
.dialog { position: fixed; inset: 0; z-index: 30; background: rgba(8, 12, 18, 0.55); display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.dialog-box { background: var(--card); border-radius: 18px; padding: 20px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
.dialog-box h2 { font-size: 20px; }
@media (min-width: 600px) { .dialog { align-items: center; } }

/* Startschutz: Startet die App nicht, erscheint statt einer leeren Seite eine Meldung mit dem Fehler und einer Datensicherung. */

  window.addEventListener('error', function (e) { note((e.message || 'Fehler') + (e.lineno ? ' (Zeile ' + e.lineno + ':' + e.colno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; note('Promise: ' + (r && (r.message || r.code) || r)); });

    var meta = null, decks = {}, i, k;
    for (i = 0; i < localStorage.length; i++) {
      k = localStorage.key(i);
      try {
        if (k === 'schedario:meta') meta = JSON.parse(localStorage.getItem(k));
        else if (k && k.indexOf('schedario:deck:') === 0) decks[k.slice(15)] = (JSON.parse(localStorage.getItem(k)) || {}).cards || [];
      } catch (e) { /* defekter Eintrag */ }
    }
    return JSON.stringify({ app: 'schedario', v: 1, exported: new Date().toISOString(), meta: meta, decks: decks });
  }
  function fatal(extra) {
    if (shown) return; shown = true;
    if (extra) [].concat(extra).forEach(function (t) { note(String(t)); });
    var v = document.getElementById('view') || document.body, box = el('div', '', { class: 'panel', id: 'fatal', role: 'alert', style: 'margin-top:24px' });
    var tb = document.getElementById('tabbar'); if (tb) tb.hidden = true;
    v.textContent = '';

    box.appendChild(el('p', 'Deine Karten und dein Lernstand sind weiter auf diesem Gerät gespeichert. Sichere sie zur Vorsicht und schick den Fehlertext an Claude.'));
    box.appendChild(el('pre', errs.join('\n') || 'Kein Fehlertext. Die Seite wurde nicht vollständig geladen.', { class: 'pre', id: 'fatal-err' }));
    var row = el('div', '', { class: 'actions col' });
    var b1 = el('button', 'Neu laden', { class: 'btn primary big', type: 'button' }); b1.onclick = function () { location.reload(); };
    var b2 = el('button', 'Daten sichern', { class: 'btn', type: 'button', id: 'fatal-backup' });
    b2.onclick = function () {
      var name = 'schedario-backup-' + new Date().toISOString().slice(0, 10) + '.json', blob = new Blob([backup()], { type: 'application/json' });
      try { var f = new File([blob], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f] }).catch(function () {}); return; } } catch (e) { /* weiter */ }
      var a = el('a', '', { href: URL.createObjectURL(blob), download: name }); document.body.appendChild(a); a.click(); a.remove();
    };
    var b3 = el('button', 'Fehlertext kopieren', { class: 'btn', type: 'button' });
    b3.onclick = function () { try { navigator.clipboard.writeText(errs.join('\n') + '\n' + navigator.userAgent); b3.textContent = 'Kopiert'; } catch (e) { /* egal */ } };
    var b4 = el('button', 'Offline-Speicher leeren und neu laden', { class: 'btn ghost', type: 'button', id: 'fatal-sw' });
    b4.onclick = function () {
      var jobs = [];
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));

      Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
    };
    row.appendChild(b1); row.appendChild(b2); row.appendChild(b3); row.appendChild(b4);
    box.appendChild(row);
    box.appendChild(el('p', navigator.userAgent, { class: 'detail' }));
    v.appendChild(box);
  }
  window.__schedFatal = fatal;
  // Hat die App nach 4 Sekunden nichts gezeichnet, ist beim Start etwas schiefgegangen
  setTimeout(function () { var v = document.getElementById('view'); if (v && !v.firstChild) fatal(); }, 4000);
})();
</script>

        ask('Alles löschen?', 'Alle Decks, der Lernstand und der API-Key werden von diesem Gerät entfernt.', 'Alles löschen', true).then(function (y) {
          if (!y) return; S.store.clear(); app.sess = null; app.imp = null; app.keyState = null; load(); render(); toast('Alles gelöscht.');
        });
      } }, 'Alles löschen'));
    root.appendChild(data);
    root.appendChild(h('p', { class: 'muted small center' }, 'Schedario ' + (S.VERSION || '') + ' · Wartezeiten der Phasen: 1, 3, 9, 29 und 90 Tage'));
    return root;
  }
  function saveKey(key) {
    if (!key) { toast('Bitte einen Key eintragen.'); return; }
    app.key = key; S.store.set('key', { k: key });
    app.keyState = 'busy'; render();
    S.api.models(key).then(function (list) {
      app.models = list; S.store.set('models', { list: list });
      if (list.length && !list.some(function (x) { return x.id === app.meta.settings.model; })) {
        var pref = list.filter(function (x) { return /sonnet/.test(x.id); })[0] || list[0];
        app.meta.settings.model = pref.id; saveMeta();
      }
      app.keyState = { ok: true, n: list.length };
    }, function (err) { app.keyState = { err: err }; }).then(function () { if (app.route === 'optionen') render(); });
  }
  function exportBackup() {
    var decks = {};
    app.meta.decks.forEach(function (d) { decks[d.id] = (app.order[d.id] || []).map(function (id) { var c = Object.assign({}, app.cards[id]); delete c.deck; return c; }); });
    var text = JSON.stringify({ app: 'schedario', v: 1, exported: new Date(S.now()).toISOString(), meta: app.meta, decks: decks });
    var name = 'schedario-backup-' + new Date(S.now()).toISOString().slice(0, 10) + '.json';
    var blob = new Blob([text], { type: 'application/json' });
    try {
      var file = new File([blob], name, { type: 'application/json' });
      if (isIos() && g.navigator.canShare && g.navigator.canShare({ files: [file] })) {
        g.navigator.share({ files: [file], title: name }).catch(function () { /* abgebrochen */ });
        return;
      }
    } catch (e) { /* weiter mit Download */ }
    var url = URL.createObjectURL(blob), a = h('a', { href: url, download: name });
    doc.body.appendChild(a); a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 1000);
    toast('Backup wird gespeichert.');
  }
  function importBackup(file) {
    if (!file) return;
    file.text().then(function (t) {
      var j = JSON.parse(t);
      if (!j || j.app !== 'schedario' || !j.meta || !j.decks) throw new Error('kein Schedario-Backup');
      return ask('Backup laden?', 'Die Decks und der Lernstand auf diesem Gerät werden durch das Backup vom ' + String(j.exported || '').slice(0, 10) + ' ersetzt.', 'Ersetzen', true).then(function (y) {
        if (!y) return;
        var key = app.key, models = app.models;
        S.store.clear();
        if (key) S.store.set('key', { k: key });
        if (models) S.store.set('models', { list: models });
        S.store.set('meta', j.meta);
        Object.keys(j.decks).forEach(function (id) { S.store.set('deck:' + id, { cards: j.decks[id] }); });
        app.sess = null; app.imp = null; load(); render(); toast('Backup geladen.');
      });
    }).catch(function (e) { toast('Die Datei ist kein gültiges Backup (' + ((e && e.message) || e) + ').', 5000); });
  }

  /* ---------- Start ---------- */
  function start() {
    try { startInner(); } catch (e) {
      if (g.__schedFatal) g.__schedFatal([String((e && e.message) || e), String((e && e.stack) || '').split('\n').slice(0, 3).join('\n')]);
      else throw e;
    }
  }
  function startInner() {
    load();
    g.addEventListener('hashchange', onHash);
    doc.addEventListener('click', function (e) {
      var w = e.target.closest && e.target.closest('.w');
      if (w) { e.preventDefault(); openTip(w); return; }
      if (!doc.contains(e.target) || (e.target.closest && e.target.closest('#tip'))) return;   // Knopf in der Blase (auch wenn er sich gerade selbst ersetzt hat)
      closeTip();
    });
    doc.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeTip(); return; }
      var w = e.target.closest && e.target.closest('.w');
      if (w && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openTip(w); }
    });
    g.addEventListener('resize', closeTip);
    ['heute', 'import', 'optionen'].forEach(function (r) {
      $('tab-' + r).addEventListener('click', function (e) { e.preventDefault(); go(r); });
    });
    doc.addEventListener('visibilitychange', function () {
      if (!doc.hidden && (app.route === 'heute' || (app.route === 'deck' && !app.edit && !app.rename))) render();
    });
    onHash();
    if (app.oppNews) { toast(app.oppNews, 8000); app.oppNews = null; }
    if ('serviceWorker' in g.navigator && /^https?:$/.test(g.location.protocol)) {
      g.navigator.serviceWorker.register('sw.js').catch(function () { /* ohne Offline-Modus */ });
    }
  }
  S.start = start; S.render = render; S.go = go; S.takeCards = takeCards; S.plan = plan;
  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', start); else start();
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
